name: Lokinet Windows Build

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install cross-compile dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git pkg-config automake libtool \
            mingw-w64 nsis librsvg2-bin

          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix

      - name: Install Node.js + Yarn
        run: |
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs
          npm install -g yarn

      - name: Prepare Windows resources
        run: |
          mkdir -p build/win32
          cat > build/win32/lokinet-cntrl.rc << 'EOF'
          #include <windows.h>
          1 ICON "../win32-setup/lokinet.ico"
          EOF

      - name: Configure & Build
        run: |
          cmake -B build -S . \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres
          cmake --build build --config Release -j2

      - name: Package (if supported)
        run: |
          cd build
          cpack || true

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lokinet-windows
          path: |
            build/**/*.exe
            build/**/*.msi
            build/**/*.zip
            build/**/*.tar.gz
          if-no-files-found: warn
